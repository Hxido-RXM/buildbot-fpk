name: Build Hermes and Release

on:

  # 自动跟版：每周一 3:3 UTC（错峰）
  schedule:
    - cron: '3 3 * * 1'
  workflow_dispatch:
    inputs:
      manifest_version:
        description: 'manifest 中的版本号（例如 0.7.25）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true
      hermes_agent_version:
        description: 'hermes-agent 的 npm 版本号（例如 0.21.5，或 latest）'
        required: false
        type: string
        default: 'latest'
      hermes_web_ui_version:
        description: 'hermes-web-ui 的 npm 版本号（例如 0.7.25，或 latest）'
        required: false
        type: string
        default: 'latest'
      node_version:
        description: 'Node.js 版本号（例如 24.21.0，不带 v）'
        required: false
        type: string
        default: '24.21.0'
      node_upgrade:
        description: '安装时是否更新 Node（0=不更新，1=更新）'
        required: false
        type: choice
        options:
          - '1'
          - '0'
        default: '0'

      force_build:
        description: '即使检测到无新版本也强制构建'
        required: false
        type: boolean
        default: false
jobs:
  # 第一步：在 Debian 12 容器中安装 hermes 并压缩 server 目录
  # ========== layer 1：检测上游最新版本 ==========
  detect:
    name: 检测上游最新版本
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${ steps.detect.outputs.upstream_version }
      manifest_version: ${ steps.detect.outputs.manifest_version }
      changelog: ${ steps.detect.outputs.changelog }
      should_build: ${ steps.detect.outputs.should_build }
      need_reason: ${ steps.detect.outputs.need_reason }
    steps:
      - name: 探测上游最新版本
        id: detect
        env:
          GH_TOKEN: ${ secrets.BUILDBOT }
        run: |
          set -euo pipefail
          # 注意：runner 上直连上游，不要写代理
          NEW_VERSION="$(curl -fsSL --retry 3 --retry-delay 5 --max-time 30 \
            "https://registry.npmjs.org/hermes-web-ui/latest" | jq -r '.version' 2>/dev/null || true)"
          if [ -z "$NEW_VERSION" ] || [ "$NEW_VERSION" = "null" ]; then
            echo "::error::未能解析上游版本号（raw=$TAG）"
            exit 1
          fi
          echo "上游最新版本: $NEW_VERSION"
          echo "upstream_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          IN_MV="${ github.event.inputs.manifest_version }"
          LAST=""
          CHART=""
          if [ -n "$IN_MV" ]; then
            MV="$IN_MV"
          else
            CHART="$(curl -fsSL --max-time 20 \
              "https://raw.githubusercontent.com/Hxido-RXM/FnDepot/main/fnpack.json" 2>/dev/null || true)"
            if [ -n "$CHART" ]; then
              LAST="$(printf '%s' "$CHART" \
                | jq -r '(.apps."Hermes".releases // {}) | keys[]' 2>/dev/null \
                | sort -V | tail -1 || true)"
            fi
            MV="$NEW_VERSION"
          fi
          echo "manifest_version=$MV" >> "$GITHUB_OUTPUT"
          echo "上次已发布: ${LAST:-<无>} → 本次: $MV"

          IN_CL="${ github.event.inputs.changelog }"
          CL="${IN_CL:-自动构建：Hermes $NEW_VERSION}"
          echo "changelog=$CL" >> "$GITHUB_OUTPUT"

          FORCE="${ github.event.inputs.force_build }"
          if [ "$FORCE" = "true" ]; then
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
            echo "need_reason=force_build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_CL=""
          if [ -n "$CHART" ]; then
            LAST_CL="$(printf '%s' "$CHART" | jq -r \
              '(.apps."Hermes".releases // {}) | to_entries
               | (sort_by(.key) | last) as $x
               | ($x.value.changelog // "")' 2>/dev/null || true)"
          fi
          echo "已发布记录最近 changelog: ${LAST_CL:-<未取到>}"
          if printf '%s' "$LAST_CL" | grep -qF "$NEW_VERSION"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "need_reason=已发布过 $NEW_VERSION，跳过" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
            echo "need_reason=检测到 $NEW_VERSION 尚未发布" >> "$GITHUB_OUTPUT"
          fi

      - name: 汇总探测结果
        run: |
          echo "upstream_version  = ${ steps.detect.outputs.upstream_version }"
          echo "manifest_version  = ${ steps.detect.outputs.manifest_version }"
          echo "should_build      = ${ steps.detect.outputs.should_build }"
          echo "need_reason       = ${ steps.detect.outputs.need_reason }"

  build-in-container:
    needs: detect
    # 无新版则明确跳过
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    container: debian:12
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="Hermes"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          [ -z "$MANIFEST_VERSION" ] && MANIFEST_VERSION="${{ needs.detect.outputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          [ -z "$CHANGELOG" ] && CHANGELOG="${{ needs.detect.outputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 安装 Node.js 24 和基础工具
        run: |
          apt-get update
          apt-get install -y curl git python3 build-essential
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs

      - name: 创建目标目录并全局安装 hermes-agent 和 hermes-web-ui
        run: |
          mkdir -p /var/apps/Hermes/target/server
          AGENT_VERSION="${{ github.event.inputs.hermes_agent_version }}"
          UI_VERSION="${{ github.event.inputs.hermes_web_ui_version }}"
          if [ "$AGENT_VERSION" = "latest" ]; then AGENT_PKG="hermes-agent"; else AGENT_PKG="hermes-agent@$AGENT_VERSION"; fi
          if [ "$UI_VERSION" = "latest" ]; then UI_PKG="hermes-web-ui"; else UI_PKG="hermes-web-ui@$UI_VERSION"; fi
          npm install -g $AGENT_PKG $UI_PKG --prefix /var/apps/Hermes/target/server

      - name: 压缩 server 目录为 server.tar.xz
        run: |
          cd /var/apps/Hermes/target
          tar -cJf server.tar.xz server

      - name: 上传 server.tar.xz 作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.platform }}
          path: /var/apps/Hermes/target/server.tar.xz
          if-no-files-found: error

  # 第二步：在宿主机（容器外）进行 fnpack 打包
  package:
    name: 打包 fpk
    needs: build-in-container
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
            node_arch: x64
          - os: ubuntu-24.04-arm
            platform: arm
            node_arch: arm64
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量（从 build-in-container 继承）
        id: set_vars
        run: |
          echo "app_name=${{ needs.build-in-container.outputs.app_name }}" >> $GITHUB_OUTPUT
          echo "manifest_version=${{ needs.build-in-container.outputs.manifest_version }}" >> $GITHUB_OUTPUT
          echo "changelog=${{ needs.build-in-container.outputs.changelog }}" >> $GITHUB_OUTPUT

      - name: 下载对应架构的 server.tar.xz
        uses: actions/download-artifact@v7
        with:
          name: server-${{ matrix.platform }}
          path: ./server_artifact

      - name: 下载 Node.js 压缩包（${{ matrix.platform }}）
        run: |
          NODE_VERSION="${{ github.event.inputs.node_version }}"
          NODE_ARCH="${{ matrix.node_arch }}"
          DOWNLOAD_URL="https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz"
          echo "下载地址: $DOWNLOAD_URL"
          curl -fL "$DOWNLOAD_URL" -o node.tar.xz
          echo "下载完成："
          ls -la node.tar.xz
          file node.tar.xz

      - name: 检出 buildbot 仓库（包含 fnpack 模板）
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ needs.build-in-container.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制 server.tar.xz 到 app 目录
        run: |
          mkdir -p build_workspace/Hermes/app
          cp ./server_artifact/server.tar.xz build_workspace/Hermes/app/

      - name: 复制 node.tar.xz 到 app 目录
        run: |
          APP_DIR="build_workspace/Hermes/app"
          cp node.tar.xz "$APP_DIR/"
          echo "复制完成，app 目录内容："
          ls -la "$APP_DIR"

      - name: 替换 install_callback 中的 node_upgrade 占位符
        run: |
          CALLBACK_PATH="build_workspace/Hermes/cmd/install_callback"
          if [ ! -f "$CALLBACK_PATH" ]; then
            echo "错误：install_callback 文件不存在于 $CALLBACK_PATH"
            exit 1
          fi
          NODE_UPGRADE="${{ github.event.inputs.node_upgrade }}"
          echo "node_upgrade = $NODE_UPGRADE"
          sed -i "s/\${node_upgrade}/$NODE_UPGRADE/g" "$CALLBACK_PATH"
          echo "install_callback 修改后的内容："
          cat "$CALLBACK_PATH"

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ needs.build-in-container.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ needs.build-in-container.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build-in-container.outputs.changelog }}"
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s|\${VERSION}|$MANIFEST_VERSION|g" "$MANIFEST_PATH"
          sed -i "s|\${CHANGELOG}|$ESCAPED_CHANGELOG|g" "$MANIFEST_PATH"
          sed -i "s|\${PLATFORM}|${{ matrix.platform }}|g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ needs.build-in-container.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ needs.build-in-container.outputs.app_name }}-${{ needs.build-in-container.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  publish:
    name: 发布到 Fndepot Release
    needs: [detect, package]
    if: always() && needs.package.result == 'success' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true')
    uses: ./.github/workflows/Publish.yaml
    with:
      # 防跨应用同日撞 tag 互相覆盖
      release_tag: ${{ needs.package.outputs.app_name }}-${{ needs.package.outputs.manifest_version }}
      app_name: ${{ needs.package.outputs.app_name }}
      manifest_version: ${{ needs.package.outputs.manifest_version }}
      changelog: ${{ needs.package.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
