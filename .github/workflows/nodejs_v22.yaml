name: Build nodejs_v22 and Release

on:

  # 自动跟版：每周一 3:41 UTC（错峰，避免与其它 cron 撞车/API 限流）
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: '上游版本号（例如 22.23.2，不带 v）'
        required: true
        type: string
      manifest_version:
        description: 'manifest 中的版本号（留空则与上游版本号一致）'
        required: false
        type: string
        default: ''
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

      force_build:
        description: '即使检测到无新版本也强制构建'
        required: false
        type: boolean
        default: false
jobs:
  # ========== layer 1：检测上游最新版本 ==========
  detect:
    name: 检测上游最新版本
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${{ steps.detect.outputs.upstream_version }}
      manifest_version: ${{ steps.detect.outputs.manifest_version }}
      changelog: ${{ steps.detect.outputs.changelog }}
      should_build: ${{ steps.detect.outputs.should_build }}
      need_reason: ${{ steps.detect.outputs.need_reason }}
    steps:
      - name: 探测上游最新版本
        id: detect
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          set -euo pipefail

          # ---------- 1) 取上游最新版本 ----------
          # 注意：GitHub Actions runner 上直连 api.github.com，不要写代理
          TAG="$(curl -fsSL --retry 3 --retry-delay 5 --max-time 30 \
            "https://nodejs.org/dist/index.json" \
            | jq -r '[.[]|select(.version|startswith("v22."))][0].version' 2>/dev/null || true)"
          NEW_VERSION="$(printf '%s' "$TAG" | sed -E 's/^v//')"

          if [ -z "$NEW_VERSION" ] || [ "$NEW_VERSION" = "null" ]; then
            echo "::error::未能解析上游版本号（raw=$TAG）"
            exit 1
          fi
          echo "上游最新版本: $NEW_VERSION"
          echo "upstream_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # ---------- 2) manifest 版本：手动优先，否则读已发布记录 +1 ----------
          IN_MV="${{ github.event.inputs.manifest_version }}"
          LAST=""
          CHART=""
          if [ -n "$IN_MV" ]; then
            MV="$IN_MV"
          else
            CHART="$(curl -fsSL --max-time 20 \
              "https://raw.githubusercontent.com/Hxido-RXM/FnDepot/main/fnpack.json" 2>/dev/null || true)"
            if [ -n "$CHART" ]; then
              LAST="$(printf '%s' "$CHART" \
                | jq -r '(.apps."nodejs_v22".releases // {}) | keys[]' 2>/dev/null \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V | tail -1 || true)"
            fi
            if [ -n "$LAST" ]; then
              MV="$(printf '%s' "$LAST" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')"
            else
              MV="1.0.$(date -u +%y%m%d)"
            fi
          fi
          echo "manifest_version=$MV" >> "$GITHUB_OUTPUT"
          echo "上次已发布 manifest 版本: ${LAST:-<无>} → 本次建议: $MV"

          # ---------- 3) changelog：必须含版本号串（判据依赖） ----------
          IN_CL="${{ github.event.inputs.changelog }}"
          CL="${IN_CL:-自动构建：nodejs_v22 $NEW_VERSION}"
          echo "changelog=$CL" >> "$GITHUB_OUTPUT"

          # ---------- 4) 是否需要构建 ----------
          IN_VER="${{ github.event.inputs.version }}"
          FORCE="${{ github.event.inputs.force_build }}"
          if [ -n "$IN_VER" ]; then
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
            echo "need_reason=手工指定版本 $IN_VER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
            echo "need_reason=force_build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_CL=""
          if [ -n "$CHART" ]; then
            LAST_CL="$(printf '%s' "$CHART" | jq -r \
              '(.apps."nodejs_v22".releases // {}) | to_entries
               | (sort_by(.key) | last) as $x
               | ($x.value.changelog // "")' 2>/dev/null || true)"
          fi
          echo "已发布记录最近 changelog: ${LAST_CL:-<未取到>}"
          if printf '%s' "$LAST_CL" | grep -qF "$NEW_VERSION"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "need_reason=已发布过 $NEW_VERSION，跳过" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
            echo "need_reason=检测到 $NEW_VERSION 尚未发布" >> "$GITHUB_OUTPUT"
          fi

      - name: 汇总探测结果
        run: |
          echo "upstream_version  = ${{ steps.detect.outputs.upstream_version }}"
          echo "manifest_version  = ${{ steps.detect.outputs.manifest_version }}"
          echo "should_build      = ${{ steps.detect.outputs.should_build }}"
          echo "need_reason       = ${{ steps.detect.outputs.need_reason }}"

  build:
    needs: detect
    # 无新版则明确跳过
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
            node_arch: x64
          - os: ubuntu-24.04-arm
            platform: arm
            node_arch: arm64
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="nodejs_v22"
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${{ needs.detect.outputs.upstream_version }}"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          [ -z "$MANIFEST_VERSION" ] && MANIFEST_VERSION="${{ needs.detect.outputs.manifest_version }}"
          # 未填写 manifest_version 时，回退使用上游版本号
          if [ -z "$MANIFEST_VERSION" ]; then
            MANIFEST_VERSION="$VERSION"
          fi
          CHANGELOG="${{ github.event.inputs.changelog }}"
          [ -z "$CHANGELOG" ] && CHANGELOG="${{ needs.detect.outputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "upstream_version=$VERSION" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "上游版本: $VERSION"
          echo "manifest 版本: $MANIFEST_VERSION"

      - name: 下载 Node.js 压缩包（${{ matrix.platform }}）
        run: |
          VERSION="${{ steps.set_vars.outputs.upstream_version }}"
          NODE_ARCH="${{ matrix.node_arch }}"
          DOWNLOAD_URL="https://nodejs.org/dist/v${VERSION}/node-v${VERSION}-linux-${NODE_ARCH}.tar.xz"
          echo "下载地址: $DOWNLOAD_URL"
          curl -fL "$DOWNLOAD_URL" -o node.tar.xz
          echo "下载完成："
          ls -la node.tar.xz
          file node.tar.xz

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工具和模板
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制 node.tar.xz 到 app 目录
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          mkdir -p "$APP_DIR"
          cp node.tar.xz "$APP_DIR/"
          echo "复制完成，app 目录内容："
          ls -la "$APP_DIR"

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s|\${VERSION}|$MANIFEST_VERSION|g" "$MANIFEST_PATH"
          sed -i "s|\${CHANGELOG}|$ESCAPED_CHANGELOG|g" "$MANIFEST_PATH"
          sed -i "s|\${PLATFORM}|${{ matrix.platform }}|g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true')
    uses: ./.github/workflows/Publish.yaml
    with:
      # 防跨应用同日撞 tag 互相覆盖
      release_tag: ${{ needs.build.outputs.app_name }}-${{ needs.build.outputs.manifest_version }}
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.manifest_version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
