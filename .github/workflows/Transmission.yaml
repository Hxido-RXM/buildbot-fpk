name: Build Transmission and Release

on:

  # 自动跟版：每周一 3:6 UTC（错峰）
  schedule:
    - cron: '6 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Transmission 版本号（例如 4.1.3）'
        required: true
        type: string
      manifest_version:
        description: 'manifest 中的版本号（例如 4.1.3）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

      force_build:
        description: '即使检测到无新版本也强制构建'
        required: false
        type: boolean
        default: false
jobs:
  # ========== layer 1：检测上游最新版本 ==========
  detect:
    name: 检测上游最新版本
    runs-on: ubuntu-24.04
    outputs:
      upstream_version: ${ steps.detect.outputs.upstream_version }
      manifest_version: ${ steps.detect.outputs.manifest_version }
      changelog: ${ steps.detect.outputs.changelog }
      should_build: ${ steps.detect.outputs.should_build }
      need_reason: ${ steps.detect.outputs.need_reason }
    steps:
      - name: 探测上游最新版本
        id: detect
        env:
          GH_TOKEN: ${ secrets.BUILDBOT }
        run: |
          set -euo pipefail
          # 注意：runner 上直连上游，不要写代理
          TAG=""
          if [ -n "${GH_TOKEN:-}" ]; then
            TAG="$(curl -fsSL -H "Authorization: token $GH_TOKEN" \
              --retry 3 --retry-delay 5 --max-time 30 \
              "https://api.github.com/repos/transmission/transmission/releases/latest" \
              | jq -r '.tag_name' 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG="$(curl -fsSL --retry 3 --retry-delay 5 --max-time 30 \
              "https://api.github.com/repos/transmission/transmission/releases/latest" \
              | jq -r '.tag_name' 2>/dev/null || true)"
          fi
          NEW_VERSION="$(printf '%s' "$TAG" | sed -E 's/^v//')"
          if [ -z "$NEW_VERSION" ] || [ "$NEW_VERSION" = "null" ]; then
            echo "::error::未能解析上游版本号（raw=$TAG）"
            exit 1
          fi
          echo "上游最新版本: $NEW_VERSION"
          echo "upstream_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          IN_MV="${ github.event.inputs.manifest_version }"
          LAST=""
          CHART=""
          if [ -n "$IN_MV" ]; then
            MV="$IN_MV"
          else
            CHART="$(curl -fsSL --max-time 20 \
              "https://raw.githubusercontent.com/Hxido-RXM/FnDepot/main/fnpack.json" 2>/dev/null || true)"
            if [ -n "$CHART" ]; then
              LAST="$(printf '%s' "$CHART" \
                | jq -r '(.apps."Transmission".releases // {}) | keys[]' 2>/dev/null \
                | sort -V | tail -1 || true)"
            fi
            MV="$NEW_VERSION"
          fi
          echo "manifest_version=$MV" >> "$GITHUB_OUTPUT"
          echo "上次已发布: ${LAST:-<无>} → 本次: $MV"

          IN_CL="${ github.event.inputs.changelog }"
          CL="${IN_CL:-自动构建：Transmission $NEW_VERSION}"
          echo "changelog=$CL" >> "$GITHUB_OUTPUT"

          FORCE="${ github.event.inputs.force_build }"
          if [ "$FORCE" = "true" ]; then
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
            echo "need_reason=force_build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_CL=""
          if [ -n "$CHART" ]; then
            LAST_CL="$(printf '%s' "$CHART" | jq -r \
              '(.apps."Transmission".releases // {}) | to_entries
               | (sort_by(.key) | last) as $x
               | ($x.value.changelog // "")' 2>/dev/null || true)"
          fi
          echo "已发布记录最近 changelog: ${LAST_CL:-<未取到>}"
          if printf '%s' "$LAST_CL" | grep -qF "$NEW_VERSION"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "need_reason=已发布过 $NEW_VERSION，跳过" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
            echo "need_reason=检测到 $NEW_VERSION 尚未发布" >> "$GITHUB_OUTPUT"
          fi

      - name: 汇总探测结果
        run: |
          echo "upstream_version  = ${ steps.detect.outputs.upstream_version }"
          echo "manifest_version  = ${ steps.detect.outputs.manifest_version }"
          echo "should_build      = ${ steps.detect.outputs.should_build }"
          echo "need_reason       = ${ steps.detect.outputs.need_reason }"

  build:
    needs: detect
    # 无新版则明确跳过
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86
          - os: ubuntu-22.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      upstream_version: ${{ steps.set_vars.outputs.upstream_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="Transmission"
          VERSION="${{ github.event.inputs.version }}"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          [ -z "$MANIFEST_VERSION" ] && MANIFEST_VERSION="${{ needs.detect.outputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          [ -z "$CHANGELOG" ] && CHANGELOG="${{ needs.detect.outputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "upstream_version=$VERSION" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential cmake libssl-dev pkg-config libcurl4-openssl-dev \
            zlib1g-dev gettext wget curl jq

      - name: 下载 Transmission 源码
        run: |
          VERSION="${{ steps.set_vars.outputs.upstream_version }}"
          wget "https://github.com/transmission/transmission/releases/download/${VERSION}/transmission-${VERSION}.tar.xz"
          tar -xf "transmission-${VERSION}.tar.xz"
          mv "transmission-${VERSION}" transmission-src

      - name: 配置 CMake
        working-directory: ./transmission-src
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/var/apps/Transmission/target \
            -DENABLE_GTK=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_MAC=OFF \
            -DWITH_CRYPTO=openssl \
            -DUSE_SYSTEM_EVENT2=OFF \
            -DUSE_SYSTEM_DEFLATE=OFF \
            -DUSE_SYSTEM_DHT=OFF \
            -DUSE_SYSTEM_MINIUPNPC=OFF \
            -DUSE_SYSTEM_NATPMP=OFF \
            -DUSE_SYSTEM_UTP=OFF \
            -DUSE_SYSTEM_B64=OFF \
            -DUSE_SYSTEM_PSL=OFF \
            -DRUN_CLANG_TIDY=OFF

      - name: 编译
        working-directory: ./transmission-src
        run: cmake --build build --parallel $(nproc)

      - name: 下载 TrguiNG 最新 web 包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/ManuZhu0728/TrguiNG/releases/latest")
          DOWNLOAD_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("trguing-web-.*\\.zip")) | .browser_download_url' | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "错误：未找到 trguing-web-*.zip 文件"
            exit 1
          fi
          wget "$DOWNLOAD_URL" -O trguing-web.zip
          unzip trguing-web.zip -d trguing-web-extracted
          echo "TrguiNG 解压完成，目录结构："
          ls -la trguing-web-extracted/

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v6
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工具和模板
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            FNPACK_BIN="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.3-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      # ========== 项目特有的复制步骤 ==========
      - name: 复制编译产物到 app/bin
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          mkdir -p "$APP_DIR/bin"
          cp transmission-src/build/daemon/transmission-daemon "$APP_DIR/bin/"
          cp transmission-src/build/utils/transmission* "$APP_DIR/bin/"
          chmod +x "$APP_DIR/bin"/transmission*
          echo "复制完成，app/bin 内容："
          ls -la "$APP_DIR/bin"

      - name: 复制 TrguiNG 到 app/www
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          mkdir -p "$APP_DIR/www"
          if [ $(ls -1 trguing-web-extracted | wc -l) -eq 1 ] && [ -d "trguing-web-extracted/$(ls trguing-web-extracted)" ]; then
            SUBDIR=$(ls trguing-web-extracted)
            cp -r "trguing-web-extracted/$SUBDIR"/* "$APP_DIR/www/"
          else
            cp -r trguing-web-extracted/* "$APP_DIR/www/"
          fi
          echo "复制完成，app/www 内容："
          ls -la "$APP_DIR/www"
      # =====================================

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s|\${VERSION}|$MANIFEST_VERSION|g" "$MANIFEST_PATH"
          sed -i "s|\${CHANGELOG}|$ESCAPED_CHANGELOG|g" "$MANIFEST_PATH"
          sed -i "s|\${PLATFORM}|${{ matrix.platform }}|g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  # ========== 发布到 Fndepot ==========
  publish:
    name: 发布到 Fndepot Release
    needs: [detect, build]
    if: always() && needs.build.result == 'success' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true')
    uses: ./.github/workflows/Publish.yaml
    with:
      # 防跨应用同日撞 tag 互相覆盖
      release_tag: ${{ needs.build.outputs.app_name }}-${{ needs.build.outputs.manifest_version }}
      app_name: ${{ needs.build.outputs.app_name }}
      manifest_version: ${{ needs.build.outputs.manifest_version }}
      changelog: ${{ needs.build.outputs.changelog }}
    secrets:
      BUILDBOT: ${{ secrets.BUILDBOT }}
